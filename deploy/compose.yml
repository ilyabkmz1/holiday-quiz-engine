# Боевой стек на облачной ВМ. Не путать с ../docker-compose.yml (локальная разработка).
# Запуск — только через deploy/deploy.sh (он подставляет --env-file /opt/quiz/.env и режим).
# Режим задаёт .env: COMPOSE_PROFILES=staging включает Mailpit, пустое значение — боевой режим.
name: quiz

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL:?Задайте DATABASE_URL в .env}
  APP_URL: ${APP_URL:?Задайте APP_URL в .env}
  # Какой пакет из tenants/ показывать; по умолчанию — эталонный demo-office.
  # Пустое значение (TENANT=) включает общий сервер: нужны TENANT_BASE_DOMAIN и образ со всеми нужными пакетами (QUIZ_PACKS).
  TENANT: ${TENANT-demo-office}
  TENANT_BASE_DOMAIN: ${TENANT_BASE_DOMAIN:-}
  # Администратор из ADMIN_* в общем режиме (без TENANT) действует только при SUPERADMIN=true; операторов клиентов заводит quiz:admin.
  SUPERADMIN: ${SUPERADMIN:-false}
  TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:-}
  # Подпись личного QR погашения наград адвента на кассе; обязателен в production, если у адвента есть награды redeem cashier/both.
  REWARD_QR_SECRET: ${REWARD_QR_SECRET:-}
  SMTP_HOST: ${SMTP_HOST:?Задайте SMTP_HOST в .env}
  SMTP_PORT: ${SMTP_PORT:?Задайте SMTP_PORT в .env}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_FROM: ${SMTP_FROM:?Задайте SMTP_FROM в .env}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:?Задайте ADMIN_USERNAME в .env}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}
  # Закрытый стенд: оба значения заданы -> весь сайт под Basic auth. В боевом режиме пусто.
  STAGING_USERNAME: ${STAGING_USERNAME:-}
  STAGING_PASSWORD: ${STAGING_PASSWORD:-}
  QUIZ_FORCE_OPEN: ${QUIZ_FORCE_OPEN:-false}
  NODE_OPTIONS: --max-old-space-size=768

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quiz
      POSTGRES_USER: quiz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    # terse + panic: при нарушении уникального индекса PostgreSQL не пишет в лог строку DETAIL
    # «Key (normalizedEmail)=(...) already exists» и текст запроса, то есть email игрока в логи не попадает.
    command: ["postgres", "-c", "log_error_verbosity=terse", "-c", "log_min_error_statement=panic"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Порт намеренно не публикуется: к БД ходят только контейнеры этой сети.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quiz -d quiz"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    logging: *logging

  migrate:
    image: ${COMPOSE_PROJECT_NAME:-quiz}-migrate:latest
    build:
      context: ..
      target: migrate
      args:
        # Те же пакеты, что и в app (seed засевает кампании из tenants/).
        QUIZ_PACKS: ${QUIZ_PACKS:-${TENANT:-demo-office}}
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Задайте DATABASE_URL в .env}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    logging: *logging

  app:
    image: ${COMPOSE_PROJECT_NAME:-quiz}-app:latest
    build:
      context: ..
      target: runner
      args:
        # Ревизия для GET /api/health; deploy.sh выставляет её из git rev-parse --short HEAD.
        APP_VERSION: ${APP_VERSION:-dev}
        # Какие пакеты попадают в образ: по умолчанию только TENANT (демо и чужие клиенты в боевой образ не входят).
        # Общий сервер: QUIZ_PACKS=slug1,slug2 или QUIZ_PACKS=all (тогда нужен TENANT_BASE_DOMAIN вместо TENANT).
        QUIZ_PACKS: ${QUIZ_PACKS:-${TENANT:-demo-office}}
    restart: unless-stopped
    environment:
      <<: *app-env
    # Порт 3000 наружу не публикуется: трафик идёт через caddy.
    expose:
      - "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 1g
    logging: *logging

  # Напоминания адвента (A5): раз в REMINDERS_INTERVAL_SECONDS (по умолчанию 15 минут) запускает `npm run advent:remind`.
  # Без адвент-арендатора с reminders.channel=email сервис ничего не делает; демо-пакеты письма не шлют
  # (ADVENT_REMINDERS_DEMO=true разрешает). Тот же образ, что у migrate; БД и переменные те же, что у app.
  reminders:
    image: ${COMPOSE_PROJECT_NAME:-quiz}-migrate:latest
    restart: unless-stopped
    environment:
      <<: *app-env
      ADVENT_REMINDERS_DEMO: ${ADVENT_REMINDERS_DEMO:-false}
      REMINDER_BATCH_SIZE: ${REMINDER_BATCH_SIZE:-100}
      REMINDER_MAX_PER_RUN: ${REMINDER_MAX_PER_RUN:-2000}
      REMINDER_MAX_ATTEMPTS: ${REMINDER_MAX_ATTEMPTS:-3}
      REMINDER_RETRY_MINUTES: ${REMINDER_RETRY_MINUTES:-10}
      REMINDER_RATE_PER_SECOND: ${REMINDER_RATE_PER_SECOND:-5}
      REMINDER_MAX_LATE_HOURS: ${REMINDER_MAX_LATE_HOURS:-6}
      REMINDERS_INTERVAL_SECONDS: ${REMINDERS_INTERVAL_SECONDS:-900}
    # init: tini — PID 1 и передаёт SIGTERM циклу. Цикл по сигналу не начинает новый запуск и не досыпает паузу, а идущему
    # запуску передаёт SIGTERM: advent:remind дописывает текущее письмо и выходит, не оставляя лишних доставок в `sending`.
    # $$ -- переменные оболочки контейнера, а не подстановка Compose.
    init: true
    stop_grace_period: 60s
    command:
      - sh
      - -c
      - |
        stop=""
        pid=""
        trap 'stop=1; if [ -n "$$pid" ]; then kill -TERM "$$pid" 2>/dev/null || true; fi' TERM INT
        while [ -z "$$stop" ]; do
          npm run --silent advent:remind &
          pid=$$!
          # wait прерывается сигналом: ждём, пока запуск допишет текущее письмо.
          while kill -0 "$$pid" 2>/dev/null; do wait "$$pid" || true; done
          pid=""
          [ -n "$$stop" ] && break
          sleep "$${REMINDERS_INTERVAL_SECONDS:-900}" &
          pid=$$!
          wait "$$pid" || true
          pid=""
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # Адрес сайта: по умолчанию DOMAIN (-> автоматический TLS Let's Encrypt).
      # Для локальной проверки: CADDY_SITE_ADDRESS=http://localhost (без TLS), см. deploy/README.md.
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${DOMAIN:?Задайте DOMAIN в .env}}
      ACME_EMAIL: ${ACME_EMAIL:?Задайте ACME_EMAIL в .env}
      TLS_ASK_TOKEN: ${TLS_ASK_TOKEN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Один домен — ./Caddyfile; общий сервер со всеми клиентами — CADDYFILE=./Caddyfile.shared (on-demand TLS).
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      # Сертификаты Let's Encrypt обязаны жить в томе: иначе каждый пересоздаваемый контейнер
      # запрашивает новый и упирается в лимиты ACME.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 192m
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    # Файлы дампов принадлежат пользователю deploy на ВМ (DEPLOY_UID/DEPLOY_GID задаёт deploy/lib.sh).
    user: "${DEPLOY_UID:-1000}:${DEPLOY_GID:-1000}"
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    command: ["loop"]
    environment:
      PGHOST: db
      PGUSER: quiz
      PGDATABASE: quiz
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Час ежедневного дампа по UTC (0 = 03:00 по Москве).
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-0}
    volumes:
      - ${BACKUP_DIR:-/opt/quiz/backups}:/backups
      - ./backup/backup.sh:/scripts/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 192m
    logging: *logging

  # Только профиль staging (COMPOSE_PROFILES=staging в .env). Веб-интерфейс слушает
  # 127.0.0.1 ВМ; доступ с рабочего места: ssh -L 8025:127.0.0.1:8025 deploy@<IP>.
  mailpit:
    profiles: ["staging"]
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 192m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
