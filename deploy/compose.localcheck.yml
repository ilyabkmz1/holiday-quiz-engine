# ТОЛЬКО для локальной проверки стека (см. deploy/README.md, раздел «Локальная проверка»).
# На ВМ НЕ подключается. Переносит публикуемые порты, чтобы не конфликтовать с занятыми.
services:
  caddy:
    ports: !override
      - "18080:80"
      - "18443:443"
  mailpit:
    ports: !override
      - "127.0.0.1:18025:8025"
