name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # В main прогоны не отменяются, чтобы у каждого коммита был свой результат.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Клиент Prisma не хранится в репозитории (src/generated), а юнит-тесты транзитивно импортируют его через src/server/db.ts.
      - name: Prisma client
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run db:generate
      - run: npm test
      - name: Build
        # Заглушка для prisma generate и next build; к базе сборка не подключается.
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
        run: npm run build

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Тестовые значения одноразовой БД внутри job, не секреты.
          POSTGRES_DB: quiz_test
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Тестовые значения, имя базы удовлетворяет защите *_test из tests/integration.
      DATABASE_URL: postgresql://quiz:quiz@127.0.0.1:5432/quiz_test?schema=public
      TEST_DATABASE_URL: postgresql://quiz:quiz@127.0.0.1:5432/quiz_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Тестовые значения одноразовой БД внутри job, не секреты.
          POSTGRES_DB: quiz
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quiz -d quiz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
    env:
      # Тестовые значения, совпадают с tests/e2e/support/env.ts.
      DATABASE_URL: postgresql://quiz:quiz@127.0.0.1:5432/quiz?schema=public
      # Пустой канал включает встроенный Chromium Playwright вместо установленного Chrome.
      E2E_BROWSER_CHANNEL: ""
      # E2E идут против production-сборки (standalone server.js, как в Docker), не против next dev.
      E2E_SERVER: prod
      # Сборка вынесена в отдельный шаг ниже, Playwright только запускает готовый server.js.
      E2E_SKIP_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Wait for Mailpit
        run: curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused http://127.0.0.1:8025/api/v1/info
      - name: Migrate and seed
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:seed
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts', 'prisma/schema.prisma') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - name: Build
        run: npm run build
      - name: Run E2E (demo-office и demo-coffee)
        # Полный путь игрока на каждом пакете арендатора: селекторы берутся из пакета, сервер стартует с TENANT=<slug>.
        run: npm run test:e2e:tenants
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    name: Docker Compose и нагрузочный smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build images
        # Ревизия сборки попадает в образ и отдаётся GET /api/health.
        run: |
          export APP_VERSION="$(git rev-parse --short HEAD)"
          docker compose build
      - name: Start stack
        run: docker compose up -d
      - name: Wait for /api/ready
        run: curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-connrefused --retry-all-errors http://127.0.0.1:3000/api/ready
      - run: npm ci
      - name: Версия сборки в /api/health
        run: |
          expected="$(git rev-parse --short HEAD)"
          actual="$(curl --fail --silent http://127.0.0.1:3000/api/health)"
          echo "$actual"
          echo "$actual" | grep -q "\"version\":\"$expected\""
      - name: Load smoke
        env:
          # Origin-проверка сравнивает адрес запроса с APP_URL из docker-compose.yml (localhost),
          # поэтому 127.0.0.1 здесь дал бы 403.
          LOAD_TEST_URL: http://localhost:3000
          LOAD_TEST_CONCURRENCY: "25"
        run: npm run test:load
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  deploy-config:
    name: Деплой-конфигурация (Compose, shellcheck, Caddy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compose config (staging)
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.staging.example config --quiet
      - name: Compose config (production)
        run: docker compose -f deploy/compose.yml --env-file deploy/.env.production.example config --quiet
      - name: Mailpit только в staging
        run: |
          docker compose -f deploy/compose.yml --env-file deploy/.env.staging.example config --services | grep -qx mailpit
          ! docker compose -f deploy/compose.yml --env-file deploy/.env.production.example config --services | grep -qx mailpit
      - name: Compose config (локальная проверка)
        run: docker compose -f deploy/compose.yml -f deploy/compose.localcheck.yml --env-file deploy/.env.staging.example config --quiet
      - name: shellcheck
        run: shellcheck -x deploy/*.sh deploy/backup/*.sh
      - name: Caddyfile validate
        run: |
          docker run --rm -e CADDY_SITE_ADDRESS=quiz.example.com -e ACME_EMAIL=ops@example.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
